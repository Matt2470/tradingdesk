# The four paper bots, every 15 minutes, on GitHub's computers (free for public repositories).
# Paper money only: no exchange keys exist anywhere in this repository, and nothing here can send an order.
# Each run: bring back the bots' state from the bot-data branch (and remember which commit it was), bring back the saved
# prices, run one check (bun run engine), then publish to bot-data ONLY if nobody else did meanwhile
# (--force-with-lease). The owner's PC takes turns the same way (src/data/sync.ts), so when GitHub is late, the PC keeps
# the bots going, and the bots are never stepped twice from the same state.
name: Bots

on:
  schedule:
    - cron: "1,16,31,46 * * * *" # one minute after each 15-minute bar closes
  workflow_dispatch: {}

concurrency:
  group: bots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Bring back the bots' state
        run: |
          mkdir -p data
          if git fetch --depth=1 origin bot-data 2>/dev/null; then
            echo "BOTDATA_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
            git archive FETCH_HEAD bot derived 2>/dev/null | tar -x -C data || true
          else
            echo "BOTDATA_SHA=" >> "$GITHUB_ENV"
          fi
          ls -R data | head -40

      - name: Bring back saved prices
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Run the bots once
        env:
          BINANCE_HOST: https://data-api.binance.vision
          TZ: Europe/Madrid
          TD_ENGINE: "1" # this copy is the one that trades: it ignores settings.remote
        run: bun run engine --publish "$RUNNER_TEMP/out"

      - name: Publish to the bot-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q
          git checkout -q -b bot-data
          git add -A
          git -c user.name="tradingdesk-bots" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Bots $(date -u +%Y-%m-%dT%H:%MZ)"
          # Only if bot-data is still the commit this run started from; otherwise the PC stepped the bots first and wins.
          if git push -q --force-with-lease="refs/heads/bot-data:${BOTDATA_SHA}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot-data; then
            echo "Published."
          else
            echo "Not published: the PC checked the bots in the meantime, and its result is kept."
          fi

      - name: Save prices (every run; GitHub drops the oldest saved copies by itself)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
